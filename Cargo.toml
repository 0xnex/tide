[workspace]
members = ["programs/*"]
# fund-logic is its own workspace so it tests offline; keep it out of this one
exclude = ["fund-logic"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
